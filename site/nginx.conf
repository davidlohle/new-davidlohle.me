# This site's nginx config: included inside the image's one server {} block (homelab D70,
# docs/static-sites.md). The base owns listen, root, logs and /healthz; set paths, headers,
# redirects and error pages here. No listen, server, user, load_module or include.
# As served from shinoa until 2026-11: Astro's routes, its own 404 page, HTML cached 5 minutes.
index index.html;
absolute_redirect off;

error_page 404 /404.html;
location = /404.html {
    internal;   # the 404 page isn't a URL of its own
}

location / {
    try_files $uri $uri/ $uri/index.html =404;
}

location ~* \.html$ {
    add_header Cache-Control "public, max-age=300, must-revalidate";
}
